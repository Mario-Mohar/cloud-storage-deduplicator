[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-storage-deduplicator"
version = "2.1.0"
description = "A production-ready tool for finding and managing duplicate files in Google Drive and OneDrive"
authors = [{name = "Mario Mohar"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.1.0",
    "requests>=2.31.0",
    "click>=8.1.0",
    "dataclasses-json>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.0.290",
    "mypy>=1.5.0",
]

[project.scripts]
drive-dedup = "drive_dedup.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["drive_dedup*"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# This is the set the pipeline enforces, so `ruff check .` here is exactly what
# CI runs. It was previously declared under [tool.ruff] -- the deprecated
# location, which recent ruff warns about -- and listed some forty rule groups
# that had never been run against the code: 1138 findings the day the pipeline
# was added. A gate that is red from the first commit stops being read, so the
# enforced set is the one the code passes, and the rest is written down as
# direction of travel rather than pretended to.
#
# To pay the debt down, add groups from this list one at a time:
#   UP (pyupgrade), SIM (simplify), RET (returns), PTH (pathlib), TRY (raise),
#   N (naming), S (bandit), ARG, PL, RUF
select = ["E", "W", "F", "I", "B", "EXE"]
ignore = ["E501"]  # line length is the formatter's business, not the gate's

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true