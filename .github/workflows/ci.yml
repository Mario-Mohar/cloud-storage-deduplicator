name: CI

# Runs on every push and every pull request, forks included. Read access only:
# a fork's token is read-only anyway, and a workflow that executes contributed
# code has no business holding a write one. Posting the result is a separate
# workflow, pr-report.yml, which runs from the default branch and never
# executes any of the code under test.

on:
  # Only the default branch on push. A branch with an open pull request would
  # otherwise be checked twice for every commit -- once as a push and once as a
  # pull request -- which doubles the minutes and puts two identically named
  # status checks on the same commit.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        id: lint
        continue-on-error: true
        run: ruff check .

      - name: Tests
        id: tests
        continue-on-error: true
        run: pytest tests/ -v --junit-xml=pytest.xml --cov=drive_dedup --cov-report=term --cov-report=xml

      # Codecov keeps the history behind the number and feeds the badge in the
      # README. It never gates: a bad day at Codecov is no reason to fail a pull
      # request, and a fork or a Dependabot branch has no secrets to offer
      # anyway. The repository is public, so the upload needs no token.
      - name: Coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false

      # The two below report but do not gate. Both were declared in
      # pyproject.toml long before anything ran them, so the code owes black 19
      # files and mypy 61 findings. Failing every unrelated pull request on that
      # debt would only teach people to ignore the pipeline. They stay visible
      # in the report until the debt is paid, and can be promoted to gates then.
      - name: Formatting (reported, not gating)
        id: black
        continue-on-error: true
        run: black --check .

      - name: Types (reported, not gating)
        id: mypy
        continue-on-error: true
        run: mypy drive_dedup

      - name: Build report
        id: report
        if: always()
        env:
          LINT: ${{ steps.lint.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BLACK: ${{ steps.black.outcome }}
          MYPY: ${{ steps.mypy.outcome }}
        run: |
          mark() { if [ "$1" = success ]; then echo "✅"; else echo "❌"; fi; }
          soft() { if [ "$1" = success ]; then echo "✅"; else echo "⚠️"; fi; }
          tests_line="$(python3 .github/scripts/junit_summary.py pytest.xml)"

          coverage="not measured"
          if [ -f coverage.xml ]; then
            coverage="$(python3 -c "import xml.etree.ElementTree as ET; print('%.1f%% covered' % (float(ET.parse('coverage.xml').getroot().get('line-rate', 0)) * 100))" 2>/dev/null || echo "not measured")"
          fi

          mkdir -p pr-report
          {
            echo "| Check | | Detail |"
            echo "| --- | :-: | --- |"
            echo "| Lint | $(mark "$LINT") | ruff |"
            echo "| Tests | $(mark "$TESTS") | ${tests_line} — ${coverage} |"
            echo "| Formatting | $(soft "$BLACK") | black — reported, does not gate |"
            echo "| Types | $(soft "$MYPY") | mypy — reported, does not gate |"
          } > pr-report/report.md

          overall=success
          for outcome in "$LINT" "$TESTS"; do
            [ "$outcome" = success ] || overall=failure
          done
          echo "$overall" > pr-report/status.txt
          echo "overall=$overall" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "${{ github.event.pull_request.number }}" > pr-report/pr-number.txt
          fi
          cat pr-report/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pr-report
          path: pr-report/
          retention-days: 3

      - name: Fail if a gating check failed
        if: always() && steps.report.outputs.overall != 'success'
        run: |
          echo "A gating check failed; the table is in the job summary."
          exit 1
