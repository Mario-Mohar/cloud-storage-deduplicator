name: Feature request
description: Suggest something the plugin should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation, not the solution — it often has a simpler answer than the one you had in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like to see
    validations:
      required: true
