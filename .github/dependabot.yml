# Dependabot keeps an eye on the dependencies and opens a pull request when one
# of them moves. Two deliberate choices to keep that from turning into noise:
# monthly rather than weekly, and everything grouped into a single pull request
# per ecosystem instead of one per package. The limit is there so a month with
# many releases cannot bury the repository.

version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
